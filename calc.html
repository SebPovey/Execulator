<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html, body {
	height: 100%;
	margin: 0;
}
body {
	display: flex;
	align-items: center;
	justify-content: center;
	font-family: Arial, Helvetica, sans-serif;
	background: #f7f7f7;
	padding: 16px;
	box-sizing: border-box;
}
.container {
	width: 100%;
	max-width: 900px;
	background: #fff;
	padding: 18px;
	border-radius: 10px;
	box-shadow: 0 6px 24px rgba(0,0,0,0.08);
	box-sizing: border-box;
}
#output {
	font-family: monospace;
	font-size: clamp(12px, 1.5vw, 14px);
	line-height: 1.4;
	margin-top: 12px;
}

#variables {
	display: flex;
	flex-direction: column;
	gap: 10px;
}

.var-row {
	display: flex;
	gap: 8px;
	align-items: center;
	flex-wrap: wrap;
}


/* unified control styles */
.input-control {
	height: 44px;
	padding: 8px 12px;
	font-size: 15px;
	border: 1px solid #d0d0d0;
	border-radius: 8px;
	box-sizing: border-box;
}

input[type="text"].input-control { background: #fff; }

/* main input should expand to fill available space */
input#input.input-control { flex: 1 1 320px; min-width: 160px; }

input[type="button"].btn {
	height: 44px;
	padding: 8px 14px;
	font-size: 15px;
	border-radius: 8px;
	border: 1px solid #c8c8c8;
	background: linear-gradient(#fff,#f2f2f2);
	cursor: pointer;
	min-width: 100px;
}

/* ensure small variable fields match height */
.var-input { width: 120px; }


.hex{ color:#aa0000; }
.dec{ color:#00aa00; }
.bin{ color:#0000aa; }

@media (max-width:420px){
	.container { padding: 14px; }
	input[type="button"]{ padding: 10px; }
}
</style>
</head>
<body>
<div class="container">
<div>Note: For log use logB(base,a). JS supports Bitwise &,|,^,~,<< and >>. For powers use Math.pow(base, power).</div>
<br>
<div id="variables">
	<input type="button" class="btn" value="Create New Variable" onclick="createNewVar();"/>
</div>
<br>
<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
	<input type="text" class="input-control" value="(0.325*Math.pow(2,10))*logB(0.175,(Test/132.8))" id="input" onkeydown="if(event.keyCode == 13){Calc();}" />
	<input type="button" class="btn" value="Calc" onclick="Calc();"/>
	<input type="button" class="btn" id="copy-url-btn" value="Copy URL" onclick="copyCurrentURL();"/>
</div>

<div id="output"></div>
</div>


<script>
var variable_index = 0;
var isRestoring = false;

function getDefaultVariableName(index) {
	return String.fromCharCode(65 + (index % 26));
}

function createVariableRow(index, nameValue, valueValue) {
	const row = document.createElement('div');
	row.className = 'var-row';
	row.id = 'varrow_' + index;

	const nameInput = document.createElement('input');
	nameInput.type = 'text';
	nameInput.className = 'input-control var-input';
	nameInput.value = nameValue;
	nameInput.id = 'name_' + index;

	const valueInput = document.createElement('input');
	valueInput.type = 'text';
	valueInput.className = 'input-control var-input';
	valueInput.value = valueValue;
	valueInput.id = 'value_' + index;

	const removeBtn = document.createElement('input');
	removeBtn.type = 'button';
	removeBtn.className = 'btn';
	removeBtn.value = 'Remove';
	removeBtn.onclick = function() { removeVar(index); };

	row.appendChild(nameInput);
	row.appendChild(valueInput);
	row.appendChild(removeBtn);
	return row;
}

function createNewVar(initialName, initialValue){
	const varDiv = document.getElementById('variables');
	const idx = variable_index;
	const nameVal = (initialName !== undefined && initialName !== null && String(initialName).trim() !== '') ? initialName : getDefaultVariableName(idx);
	const valueVal = (initialValue !== undefined) ? initialValue : '0';

	varDiv.appendChild(createVariableRow(idx, nameVal, valueVal));
	variable_index += 1;
}

function removeVar(idx){
	const row = document.getElementById('varrow_' + idx);
	if(row && row.parentNode) row.parentNode.removeChild(row);
	if(!isRestoring) syncURL();
}

function collectCurrentVars(){
	const vars = [];
	for(let i = 0; i < variable_index; i++){
		const nameEl = document.getElementById('name_' + i);
		const valueEl = document.getElementById('value_' + i);
		if(nameEl && String(nameEl.value).trim() !== ''){
			vars.push({
				name: String(nameEl.value),
				value: valueEl ? String(valueEl.value) : ''
			});
		}
	}
	return vars;
}

function syncURL(){
	try{
		const input = document.getElementById('input').value;
		const vars = collectCurrentVars();
		const state = { input: input, vars: vars };
		const hash = encodeURIComponent(JSON.stringify(state));
		history.replaceState(null, '', '#' + hash);
	}catch(e){/* ignore */}
}

function loadFromHash(){
	if(!location.hash || location.hash.length < 2) return;
	try{
		isRestoring = true;
		const state = JSON.parse(decodeURIComponent(location.hash.slice(1)));
		if(state && typeof state === 'object'){
			if(state.input) document.getElementById('input').value = state.input;
			if(Array.isArray(state.vars)){
				const existingRows = document.querySelectorAll('.var-row');
				existingRows.forEach(row => row.remove());
				variable_index = 0;
				state.vars.forEach(v => createNewVar(v.name, v.value));
			}
		}
	}catch(e){ /* ignore malformed hash */ }
	isRestoring = false;
	syncURL();
}

function logB(base,val) {
  return Math.log(val) / Math.log(base);
}

function escapeHtml(str){
		return String(str)
				.replace(/&/g,'&amp;')
				.replace(/</g,'&lt;')
				.replace(/>/g,'&gt;')
				.replace(/"/g,'&quot;')
				.replace(/'/g,'&#039;');
}

function escapeRegExp(str){
    return String(str).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function findUndefinedVariableNames(input, currentVars) {
	const definedNames = new Set(currentVars.map(v => String(v.name).trim()).filter(Boolean));
	const reservedNames = new Set([
		'Math','logB','Calc','createNewVar','removeVar','collectCurrentVars','syncURL','loadFromHash',
		'escapeHtml','escapeRegExp','dec2bin','isInt','findUndefinedVariableNames','copyCurrentURL',
		'Number','String','Boolean','Array','Object','JSON','parseInt','parseFloat','isNaN','NaN',
		'window','document','console','navigator'
	]);
	const matches = String(input).match(/\b[a-zA-Z_][a-zA-Z0-9_]*\b/g) || [];
	const seen = new Set();

	return matches.filter(name => {
		if (reservedNames.has(name) || definedNames.has(name)) return false;
		if (seen.has(name)) return false;
		seen.add(name);
		return true;
	});
}

function dec2bin(dec) {
  return (dec >>> 0).toString(2);
}

function isInt(n) {
   return n % 1 === 0;
}

function fallbackCopyText(text) {
	const area = document.createElement('textarea');
	area.value = text;
	area.setAttribute('readonly', '');
	area.style.position = 'fixed';
	area.style.opacity = '0';
	document.body.appendChild(area);
	area.select();
	try { document.execCommand('copy'); } catch (e) {}
	document.body.removeChild(area);
}

function copyCurrentURL() {
	syncURL();
	const url = window.location.href;
	const button = document.getElementById('copy-url-btn');
	const originalText = button ? button.value : 'Copy URL';

	if (navigator.clipboard && window.isSecureContext) {
		navigator.clipboard.writeText(url).then(() => {
			if (button) button.value = 'Copied!';
			setTimeout(() => { if (button) button.value = originalText; }, 1200);
		}).catch(() => {
			fallbackCopyText(url);
			if (button) button.value = 'URL Ready';
			setTimeout(() => { if (button) button.value = originalText; }, 1200);
		});
		return;
	}

	fallbackCopyText(url);
	if (button) button.value = 'URL Ready';
	setTimeout(() => { if (button) button.value = originalText; }, 1200);
}

function Calc()
{
	const input = document.getElementById("input").value; 

	// read current variable inputs (so Calc uses live values even if not 'Stored')
	const current_vars = collectCurrentVars();
	const undefinedVars = findUndefinedVariableNames(input, current_vars);
	const warningHtml = undefinedVars.length
		? "<div style='color:#b22222;margin:6px 0;'><b>Warning:</b> Undefined variable(s): " + undefinedVars.map(v => escapeHtml(v)).join(', ') + "</div>"
		: "";

	let output_decimal = NaN;
	const eval_str = current_vars.map(v => 'var '+v.name+' = '+v.value+';').join('') + input;

	try {
		output_decimal = (eval?.(eval_str))*1;
	} catch (e) {
		output_decimal = NaN;
	}

	// create substituted input for display (replace variable names with values)
	let substituted = input;
	current_vars.forEach(v => {
		try{
			const name = String(v.name);
			const value = String(v.value);
			const re = new RegExp('\\b'+escapeRegExp(name)+'\\b','g');
			substituted = substituted.replace(re, '('+value+')');
		}catch(e){ }
	});

	const safeInput = escapeHtml(substituted);

	var str = "<br>Input: "+safeInput+warningHtml+"<br> Result: <b class='dec'>"+(Number.isFinite(output_decimal) ? output_decimal.toString() : 'Error')+"</b>";

	if (Number.isFinite(output_decimal) && isInt(output_decimal))
	{
		const output_hex = output_decimal.toString(16);
		const output_binary = dec2bin(output_decimal)

		var bin_str = output_binary.toString();
		const rem = 4-(bin_str.length%4);

		var pad_str = "";

		for(var i=0;i<rem;i++){
			pad_str += "0";
		}

		bin_str = pad_str + bin_str;

		str += ", <b class='hex'>0x"+output_hex.toString()+"</b>"+
		", <b class='bin'>0b"+bin_str+"</b>";
	}
	document.getElementById("output").innerHTML = str + document.getElementById("output").innerHTML;
	// update URL to reflect current input and stored vars
	syncURL();
}

// restore state from URL on load
window.addEventListener('DOMContentLoaded', function(){ loadFromHash(); });
</script>

</body>
</html>
